<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CoinsPlay Arena | Payment Gateway</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-[#0f051d] text-white min-h-screen font-sans">
    <div id="root"></div>

    <script type="text/babel">
        function PaymentGateway() {
            const [transactionId, setTransactionId] = React.useState('');
            const [loading, setLoading] = React.useState(false);
            const [success, setSuccess] = React.useState(false);

            const handleVerify = (e) => {
                e.preventDefault();
                if (!transactionId || transactionId.length < 6) {
                    alert('Please enter a valid 12-digit UTR / Transaction ID');
                    return;
                }

                setLoading(true);

                // Simulate payment verification process (2 seconds delay)
                setTimeout(() => {
                    setLoading(false);
                    setSuccess(true);

                    // Redirect user back to app or home after successful verification
                    setTimeout(() => {
                        // Yahan apna App ya Home URL daal sakta hai jahan redirect karna ho
                        window.location.href = "https://earnlyindiaapp-prog.github.io/upisteps/"; 
                    }, 2000);
                }, 2000);
            };

            return (
                <div className="max-w-md mx-auto p-6 min-h-screen flex flex-col justify-center">
                    <div className="bg-[#150a28] p-8 rounded-3xl border border-purple-500/30 shadow-2xl">
                        
                        <h1 className="text-2xl font-bold text-center text-transparent bg-clip-text bg-gradient-to-r from-purple-400 to-pink-400 mb-2">
                            CoinsPlay Arena
                        </h1>
                        <p className="text-center text-xs text-purple-300/60 mb-6">Secure UPI Payment Gateway</p>

                        <div className="bg-purple-950/60 p-4 rounded-2xl border border-purple-500/20 mb-6 text-center">
                            <span className="text-xs text-purple-300/70 block mb-1">Pay to Merchant UPI ID</span>
                            <span className="text-lg font-mono font-bold text-amber-400 select-all">uniquepiece@upi</span>
                        </div>

                        {success ? (
                            <div className="bg-green-500/20 border border-green-500/40 text-green-300 p-4 rounded-2xl text-center">
                                <p className="font-bold text-sm">Payment Verified Successfully!</p>
                                <p className="text-xs text-green-200/70 mt-1">Redirecting back to app...</p>
                            </div>
                        ) : (
                            <form onSubmit={handleVerify} className="space-y-4">
                                <div>
                                    <label className="text-xs text-purple-300/70 block mb-1.5">Enter UTR / Transaction ID</label>
                                    <input 
                                        type="text" 
                                        placeholder="e.g. 436278194562"
                                        value={transactionId}
                                        onChange={(e) => setTransactionId(e.target.value)}
                                        required
                                        className="w-full bg-purple-900/20 border border-purple-500/40 p-4 rounded-xl text-white placeholder-purple-300/30 focus:outline-none focus:border-pink-500 font-mono text-sm"
                                    />
                                </div>

                                <button 
                                    type="submit" 
                                    disabled={loading}
                                    className="w-full py-4 rounded-xl bg-gradient-to-r from-purple-600 to-pink-500 font-bold text-sm shadow-lg shadow-purple-500/20 disabled:opacity-50 transition-all"
                                >
                                    {loading ? 'Verifying Payment...' : 'Verify & Proceed'}
                                </button>
                            </form>
                        )}

                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<PaymentGateway />);
    </script>
</body>
</html>
