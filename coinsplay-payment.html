<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CoinsPlay Arena | Payment Gateway</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background-color: #0f051d; color: #ffffff; min-height: 100vh; display: flex; justify-content: center; align-items: center; }
        .container { width: 100%; max-width: 400px; padding: 20px; }
        .card { background-color: #150a28; border: 1px solid rgba(168, 85, 247, 0.3); border-radius: 24px; padding: 30px; box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5); }
        h1 { font-size: 24px; font-weight: bold; text-align: center; background: linear-gradient(to right, #c084fc, #f472b6); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 5px; }
        .subtitle { text-align: center; font-size: 12px; color: rgba(216, 180, 254, 0.6); margin-bottom: 25px; }
        .upi-box { background-color: rgba(45, 12, 85, 0.6); border: 1px solid rgba(168, 85, 247, 0.2); border-radius: 16px; padding: 15px; text-align: center; margin-bottom: 20px; }
        .upi-box span { font-size: 11px; color: rgba(216, 180, 254, 0.7); display: block; margin-bottom: 4px; }
        .upi-id { font-size: 18px; font-family: monospace; font-weight: bold; color: #fbbf24; }
        label { font-size: 12px; color: rgba(216, 180, 254, 0.7); display: block; margin-bottom: 6px; }
        input { width: 100%; background-color: rgba(59, 7, 100, 0.4); border: 1px solid rgba(168, 85, 247, 0.4); padding: 14px; border-radius: 12px; color: white; font-family: monospace; font-size: 14px; outline: none; margin-bottom: 15px; }
        input:focus { border-color: #f472b6; }
        button { width: 100%; padding: 14px; border-radius: 12px; border: none; background: linear-gradient(to right, #9333ea, #ec4899); color: white; font-weight: bold; font-size: 14px; cursor: pointer; box-shadow: 0 10px 15px -3px rgba(147, 51, 234, 0.3); }
        button:disabled { opacity: 0.5; }
        .success-box { background-color: rgba(34, 197, 94, 0.2); border: 1px solid rgba(34, 197, 94, 0.4); color: #86efac; padding: 20px; border-radius: 16px; text-align: center; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        function PaymentGateway() {
            const [transactionId, setTransactionId] = React.useState('');
            const [loading, setLoading] = React.useState(false);
            const [success, setSuccess] = React.useState(false);

            const handleVerify = (e) => {
                e.preventDefault();
                if (!transactionId || transactionId.length < 6) {
                    alert('Please enter a valid UTR / Transaction ID');
                    return;
                }

                setLoading(true);

                setTimeout(() => {
                    setLoading(false);
                    setSuccess(true);

                    setTimeout(() => {
                        window.location.href = "https://earnlyindiaapp-prog.github.io/upisteps/"; 
                    }, 2000);
                }, 2000);
            };

            return (
                <div className="container">
                    <div className="card">
                        <h1>CoinsPlay Arena</h1>
                        <p className="subtitle">Secure UPI Payment Gateway</p>

                        <div className="upi-box">
                            <span>Pay to Merchant UPI ID</span>
                            <div className="upi-id">uniquepiece@upi</div>
                        </div>

                        {success ? (
                            <div className="success-box">
                                <p style={{fontWeight: 'bold', marginBottom: '5px'}}>Payment Verified Successfully!</p>
                                <p style={{fontSize: '12px', opacity: 0.8}}>Redirecting back to app...</p>
                            </div>
                        ) : (
                            <form onSubmit={handleVerify}>
                                <label>Enter UTR / Transaction ID</label>
                                <input 
                                    type="text" 
                                    placeholder="e.g. 436278194562"
                                    value={transactionId}
                                    onChange={(e) => setTransactionId(e.target.value)}
                                    required
                                />
                                <button type="submit" disabled={loading}>
                                    {loading ? 'Verifying Payment...' : 'Verify & Proceed'}
                                </button>
                            </form>
                        )}
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<PaymentGateway />);
    </script>
</body>
</html>
