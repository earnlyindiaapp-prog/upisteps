<svg viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gradient definitions -->
    <linearGradient id="upGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00E5FF;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#00BCD4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0288D1;stop-opacity:1" />
    </linearGradient>
    
    <radialGradient id="glowGradient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#00E5FF;stop-opacity:0.4" />
      <stop offset="100%" style="stop-color:#0288D1;stop-opacity:0" />
    </radialGradient>
    
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Black circular background -->
  <circle cx="512" cy="512" r="512" fill="#0A0A0A"/>
  
  <!-- Subtle outer circle border -->
  <circle cx="512" cy="512" r="512" fill="none" stroke="#1A1A1A" stroke-width="2"/>
  
  <!-- Glow effect background -->
  <circle cx="512" cy="512" r="380" fill="url(#glowGradient)" opacity="0.6"/>
  
  <!-- Walking path/step indicator - subtle animated path -->
  <g opacity="0.15">
    <!-- Step 1 -->
    <circle cx="350" cy="620" r="25" fill="none" stroke="#00E5FF" stroke-width="3"/>
    <!-- Step 2 -->
    <circle cx="470" cy="560" r="28" fill="none" stroke="#00E5FF" stroke-width="3"/>
    <!-- Step 3 -->
    <circle cx="590" cy="490" r="32" fill="none" stroke="#00E5FF" stroke-width="3"/>
    <!-- Step 4 -->
    <circle cx="670" cy="380" r="30" fill="none" stroke="#00E5FF" stroke-width="3"/>
  </g>
  
  <!-- Main UP Monogram -->
  <g filter="url(#glow)">
    <!-- U Letter -->
    <path d="M 320 320 L 320 580 Q 320 680 420 680 L 420 680 Q 520 680 520 580 L 520 320" 
          fill="none" stroke="url(#upGradient)" stroke-width="60" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- P Letter -->
    <path d="M 620 680 L 620 320 M 620 400 L 720 400 Q 800 400 800 460 Q 800 520 720 520 L 620 520" 
          fill="none" stroke="url(#upGradient)" stroke-width="60" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  
  <!-- Upward arrow integrated into P -->
  <g filter="url(#softGlow)">
    <!-- Arrow shaft going up from P -->
    <line x1="710" y1="500" x2="710" y2="300" stroke="url(#upGradient)" stroke-width="45" stroke-linecap="round" opacity="0.8"/>
    
    <!-- Arrow head -->
    <polygon points="710,260 660,340 760,340" fill="url(#upGradient)" opacity="0.9"/>
  </g>
  
  <!-- Inner highlight accent -->
  <circle cx="512" cy="512" r="360" fill="none" stroke="url(#upGradient)" stroke-width="1" opacity="0.3"/>
  
  <!-- Subtle corner indicators for scalability (invisible but helps with favicon alignment) -->
  <circle cx="100" cy="100" r="0" fill="#00E5FF"/>
  <circle cx="924" cy="924" r="0" fill="#0288D1"/>
</svg>